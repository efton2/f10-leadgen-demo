name: Claude PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request. Ignore style, formatting, and lint preferences entirely - do not comment on them.

            Focus only on what breaks in production:
            - Business logic correctness
            - SQL injection vectors
            - Unhandled edge cases
            - N+1 queries
            - Any code touching authentication, payments, or data deletion - flag these explicitly even if the change looks minor

            Use `gh pr comment` for a single top-level summary comment.
            Use `mcp__github_inline_comment__create_inline_comment` (with `confirmed: true`) for specific line-level issues.
            Only post GitHub comments - don't submit review text as chat messages.

            End your top-level summary comment with a final line, exactly in this format and nothing else on that line:
            SEVERITY_SUMMARY: <level>
            where <level> is CRITICAL, HIGH, MEDIUM, LOW, or NONE - whichever is the highest severity finding in this review.

          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"

      - name: Alert on critical finding
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          LATEST=$(gh pr view ${{ github.event.pull_request.number }} --repo ${{ github.repository }} --json comments --jq '.comments[-1].body // ""')
          if echo "$LATEST" | grep -q "SEVERITY_SUMMARY: CRITICAL"; then
            curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
              -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
              -d text="CRITICAL finding - Claude PR review on ${{ github.repository }} PR #${{ github.event.pull_request.number }}: ${{ github.event.pull_request.html_url }}"
          fi
